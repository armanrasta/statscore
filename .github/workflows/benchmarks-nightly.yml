name: Benchmarks nightly

# Heavy performance suite — NOT on every push (see ci.yml for tests).
# Runs nightly + manual dispatch; uploads CSV/HTML artifacts.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: crates/statscore-python
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv and install deps
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install maturin numpy scipy statsmodels scikit-fuzzy

      - name: Build release extension
        run: |
          source .venv/bin/activate
          maturin develop --release

      - name: Run suite (CSV + HTML)
        working-directory: .
        run: crates/statscore-python/.venv/bin/python benchmarks/scripts/run_suite.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: statscore-benchmarks
          path: |
            benchmarks/results/*.csv
            benchmarks/plots/speedup_summary.html
          if-no-files-found: error
